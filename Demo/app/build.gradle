plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.merchant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.merchant'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            // The SDK ships its own ProGuard rules inside the .aar, so a minifying
            // build needs no keep rules of yours. This sample turns minification on to
            // show that.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Signed with the debug key only so the release APK can be installed for a
            // quick look. Use your own signing config in a real app.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    // The SDK, from Maven Central. Two lines, and that is the whole integration.
    implementation "com.paymentwall:paymentwall-android:${pwSdkVersion}"

    // Only needed if you offer MyCard. Leave this line out and the method is simply
    // not offered to the payer. It carries its own version - see gradle.properties.
    implementation "com.paymentwall:paymentwall-android-plugin-mycard:${pwMyCardVersion}"

    // NOTHING ELSE IS NEEDED, and that is the difference from the .aar route this
    // sample used to take. An .aar carries no dependency information, so androidx.core,
    // androidx.fragment, androidx.annotation and kotlin-stdlib all had to be declared
    // here by hand - and leaving one out built fine and then failed at runtime, on the
    // payment screen. The POM brings them, at the versions the SDK was tested against.

    // This sample's own UI. The SDK does not depend on AppCompat or Material.
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
