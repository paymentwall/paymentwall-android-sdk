// Repositories are deliberately just google() and mavenCentral() — the two any
// Android project already has. The SDK resolves from Maven Central like any other
// dependency, so nothing about this sample needs a private repository or a mirror.
pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'paymentwall-demo'
include ':app'
