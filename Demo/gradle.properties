org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# The SDK's Maven Central coordinates, in one place so a version bump is one edit.
#
# TWO VERSIONS, because the two artifacts version independently: the MyCard plugin
# changes far less often than the SDK, so the core can move to 2.1.0 while the plugin
# stays where it is. Use the latest of each; they do not have to match.
pwSdkVersion=2.0.1
pwMyCardVersion=2.0.1
